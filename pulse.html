<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>zeinan / tel — network telemetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #0a0c0f;
    --bg-panel: #12151a;
    --bg-panel-2: #171b21;
    --border: #21262e;
    --accent: #4fd1c5;
    --accent-dim: #2a5f5a;
    --good: #34d399;
    --warn: #fbbf24;
    --down: #f87171;
    --text: #e6e9ec;
    --text-muted: #7a838c;
    --text-faint: #4b525a;
    --mono-display: 'JetBrains Mono', monospace;
    --mono-body: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono-body);
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 0%, rgba(79,209,197,0.06), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(79,209,197,0.04), transparent 35%);
  }

  a { color: var(--accent); }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand .mark {
    font-family: var(--mono-display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.5px;
  }
  .brand .mark span { color: var(--accent); }

  .brand .sub {
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    font-size: 12px;
    letter-spacing: 0.4px;
  }
  .status-pill .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 8px var(--good);
  }
  .status-pill.warn .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .status-pill.down .dot { background: var(--down); box-shadow: 0 0 8px var(--down); }

  .clock {
    font-size: 12px;
    color: var(--text-faint);
  }

  .live-indicator {
    font-size: 11px;
    color: var(--text-faint);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .live-indicator .dot-sm { flex-shrink: 0; }
  .live-indicator.is-live { color: var(--text-muted); }

  /* ---------- Pulse line (signature element) ---------- */
  .pulse-panel {
    border: 1px solid var(--border);
    background: var(--bg-panel);
    border-radius: 4px;
    padding: 0;
    margin-bottom: 28px;
    overflow: hidden;
    position: relative;
  }
  .pulse-panel .pulse-label {
    position: absolute;
    top: 10px; left: 14px;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-faint);
    z-index: 2;
  }
  .pulse-track {
    width: 100%;
    height: 88px;
    overflow: hidden;
    position: relative;
  }
  .pulse-track svg {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 200%;
    animation: pulse-scroll 6s linear infinite;
  }
  @keyframes pulse-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse-track svg { animation: none; }
  }

  /* ---------- Section titles ---------- */
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-faint);
    margin: 0 0 12px 2px;
  }

  /* ---------- Region cards ---------- */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }

  .card {
    border: 1px solid var(--border);
    background: var(--bg-panel);
    border-radius: 4px;
    padding: 14px 16px;
    transition: border-color 0.15s ease;
  }
  .card:hover { border-color: #2c333c; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .card-top .dot-sm { margin-top: 4px; flex-shrink: 0; }

  .card-region {
    font-family: var(--mono-body);
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.2px;
    color: var(--text);
    line-height: 1.3;
  }

  .card-city {
    font-family: var(--mono-display);
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 1.4px;
    color: var(--text-faint);
    margin-top: 4px;
    margin-bottom: 14px;
  }

  .dot-sm {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 6px var(--good);
  }
  .card.warn .dot-sm { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .card.down .dot-sm { background: var(--down); box-shadow: 0 0 6px var(--down); }

  .card-metrics {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .card-latency {
    font-variant-numeric: tabular-nums;
    font-size: 24px;
    font-weight: 500;
  }
  .card-latency small { font-size: 12px; color: var(--text-faint); font-weight: 400; }
  .card.down .card-latency { color: var(--down); font-size: 15px; }

  .card-uptime {
    text-align: right;
    font-size: 11px;
    color: var(--text-faint);
  }
  .card-uptime b {
    display: block;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
  }

  /* ---------- Chart panel ---------- */
  .panel {
    border: 1px solid var(--border);
    background: var(--bg-panel);
    border-radius: 4px;
    padding: 18px 18px 8px;
    margin-bottom: 28px;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .legend {
    display: flex;
    gap: 14px;
    font-size: 11px;
    color: var(--text-faint);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 2px; display: inline-block; }

  .chart-holder { height: 260px; }

  /* ---------- Health checks row ---------- */
  .health-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .health-card {
    border: 1px solid var(--border);
    background: var(--bg-panel);
    border-radius: 4px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .health-icon {
    width: 38px; height: 38px;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono-display);
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
  }
  .health-icon.good { background: rgba(52,211,153,0.12); color: var(--good); }
  .health-icon.warn { background: rgba(251,191,36,0.12); color: var(--warn); }
  .health-icon.down { background: rgba(248,113,113,0.12); color: var(--down); }
  .health-body .health-title {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 4px;
  }
  .health-body .health-value {
    font-size: 17px;
    font-variant-numeric: tabular-nums;
  }
  .health-body .health-value.good { color: var(--good); }
  .health-body .health-value.warn { color: var(--warn); }
  .health-body .health-value.down { color: var(--down); }
  .health-body .health-sub {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 2px;
  }

  /* ---------- Per-region health table ---------- */
  .region-health {
    border: 1px solid var(--border);
    background: var(--bg-panel);
    border-radius: 4px;
    padding: 6px 18px;
    margin-bottom: 28px;
  }
  .rh-row {
    display: grid;
    grid-template-columns: 1.4fr 0.9fr 0.9fr 0.9fr;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }
  .rh-row:last-child { border-bottom: none; }
  .rh-row.rh-head {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-faint);
    padding: 10px 0 8px;
  }
  .rh-region {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: var(--mono-display);
    font-weight: 700;
    letter-spacing: 1.2px;
  }
  .rh-region .dot-sm { flex-shrink: 0; }
  .rh-region .rh-city {
    font-family: var(--mono-body);
    font-weight: 400;
    color: var(--text-faint);
    font-size: 11px;
  }
  .rh-status.good { color: var(--good); }
  .rh-status.warn { color: var(--warn); }
  .rh-status.down { color: var(--down); }
  .rh-ttfb { font-variant-numeric: tabular-nums; }
  .rh-ttfb.warn { color: var(--warn); }
  .rh-ttfb.down { color: var(--down); }

  /* ---------- Event log ---------- */
  .log-panel {
    border: 1px solid var(--border);
    background: #0d0f13;
    border-radius: 4px;
    padding: 14px 18px;
  }
  .log-line {
    font-size: 12px;
    line-height: 1.9;
    color: var(--text-muted);
    white-space: pre-wrap;
  }
  .log-line .t { color: var(--text-faint); }
  .log-line .r-good { color: var(--good); }
  .log-line .r-warn { color: var(--warn); }
  .log-line .r-down { color: var(--down); }
  .cursor {
    display: inline-block;
    width: 7px; height: 13px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    margin-top: 30px;
    font-size: 11px;
    color: var(--text-faint);
    border-top: 1px solid var(--border);
    padding-top: 16px;
    line-height: 1.7;
  }
  footer b { color: var(--text-muted); }


  /* ---------- World map ---------- */
  .map-panel {
    border: 1px solid var(--border);
    background: var(--bg-panel);
    border-radius: 4px;
    padding: 18px 18px 14px;
    margin-bottom: 28px;
  }
  .map-holder {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 1;
    max-height: 340px;
  }
  .map-holder svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .map-dots circle {
    fill: #262d35;
  }
  .map-node {
    cursor: default;
  }
  .map-node circle.core {
    stroke-width: 1.5;
  }
  .map-node circle.ping {
    fill: none;
    stroke-width: 1.5;
    opacity: 0;
  }
  .map-node.good circle.core { fill: var(--good); stroke: var(--good); }
  .map-node.good circle.ping { stroke: var(--good); animation: ping-good 2.4s ease-out infinite; }
  .map-node.warn circle.core { fill: var(--warn); stroke: var(--warn); }
  .map-node.warn circle.ping { stroke: var(--warn); animation: ping-warn 1.4s ease-out infinite; }
  .map-node.down circle.core { fill: var(--down); stroke: var(--down); }
  .map-node.down circle.ping { stroke: var(--down); animation: ping-down 1s ease-out infinite; }

  @keyframes ping-good {
    0% { r: 5; opacity: 0.6; }
    100% { r: 16; opacity: 0; }
  }
  @keyframes ping-warn {
    0% { r: 5; opacity: 0.7; }
    100% { r: 13; opacity: 0; }
  }
  @keyframes ping-down {
    0% { r: 5; opacity: 0.8; }
    100% { r: 10; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .map-node circle.ping { animation: none; }
  }

  .map-label {
    font-family: var(--mono-body);
    font-size: 9px;
    fill: var(--text-faint);
    letter-spacing: 0.3px;
  }
  .map-label.code {
    font-family: var(--mono-display);
    font-weight: 700;
    fill: var(--text-muted);
    font-size: 9px;
    letter-spacing: 0.5px;
  }

  ::selection { background: var(--accent-dim); color: #fff; }

    /* ===== zeinan nav terminal ===== */
    .navwrap{
      position:relative;
      z-index:5;
      width:100%;
      display:flex;
      justify-content:center;
      margin-bottom:28px;
    }
    .term{
      width:100%;
      max-width:560px;
      background:var(--bg-panel);
      border:1px solid var(--border);
      border-radius:10px;
      font-family:var(--mono-display);
      font-size:13px;
      overflow:hidden;
      box-shadow:0 20px 50px -20px rgba(0,0,0,0.6);
    }
    .term-bar{
      display:flex;
      align-items:center;
      gap:6px;
      padding:9px 12px;
      border-bottom:1px solid var(--border);
    }
    .term-dot{ width:9px; height:9px; border-radius:50%; opacity:0.5; }
    .term-dot.r{ background:#f87171; }
    .term-dot.y{ background:#fbbf24; }
    .term-dot.g{ background:#34d399; }
    .term-title{
      margin-left:8px;
      font-size:11px;
      letter-spacing:0.08em;
      color:var(--text-muted);
      text-transform:lowercase;
    }
    .term-body{ padding:12px 14px 14px; min-height:96px; }
    .term-line{
      display:flex;
      gap:8px;
      color:var(--text-muted);
      line-height:1.7;
      font-size:12.5px;
    }
    .term-line.out{ color:var(--text); opacity:0.85; }
    .term-line .prompt-sym{ color:var(--accent); flex-shrink:0; }
    .term-input-row{ display:flex; align-items:center; gap:8px; margin-top:4px; }
    .term-input-row .prompt-sym{ color:var(--accent); white-space:nowrap; }
    .term-input-row .prompt-sym #promptUser{ color:var(--good); }
    #navCmdInput{
      flex:1;
      background:transparent;
      border:none;
      outline:none;
      color:var(--text);
      font-family:var(--mono-display);
      font-size:13px;
      caret-color:var(--accent);
    }
    #navCmdInput::placeholder{ color:var(--text-muted); opacity:0.7; }
    .nav-hint{ font-size:11px; color:var(--text-muted); margin-top:2px; opacity:0.75; }
    .nav-chips{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    .nav-chip{
      font-family:var(--mono-display);
      font-size:11px;
      color:var(--accent);
      background:rgba(255,255,255,0.03);
      border:1px solid var(--border);
      padding:5px 10px;
      border-radius:6px;
      cursor:pointer;
      letter-spacing:0.03em;
      transition:border-color 0.15s ease, background 0.15s ease;
    }
    .nav-chip:hover{ border-color:var(--accent); background:rgba(255,255,255,0.06); }
    .nav-chip.active{ color:var(--bg); background:var(--accent); border-color:var(--accent); }
    .nav-flicker{ animation: navflicker 0.35s steps(2, end); }
    @keyframes navflicker{
      0%{ opacity:1; } 30%{ opacity:0.2; } 55%{ opacity:0.85; } 75%{ opacity:0.3; } 100%{ opacity:1; }
    }
</style>
</head>
<body>

<div class="wrap">

  <div class="navwrap">
    <div class="term">
      <div class="term-bar">
        <span class="term-dot r"></span>
        <span class="term-dot y"></span>
        <span class="term-dot g"></span>
        <span class="term-title">zeinan@web</span>
      </div>
      <div class="term-body">
        <div id="navLog"></div>
        <div class="term-input-row">
          <span class="prompt-sym"><span id="promptUser">guest</span>@zeinan.fyi $</span>
          <input id="navCmdInput" type="text" placeholder="type 'report' or 'tel' and press &#8629;" autocomplete="off" spellcheck="false">
        </div>
        <div class="nav-hint">or run:</div>
        <div class="nav-chips">
          <span class="nav-chip" id="navChipReport" data-target="report">./report</span>
          <span class="nav-chip" id="navChipTel" data-target="tel">./tel</span>
        </div>
      </div>
    </div>
  </div>


  <header>
    <div>
      <div class="brand">
        <span class="mark">zeinan<span>/</span>tel</span>
      </div>
      <div class="sub">// live network telemetry</div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <div class="live-indicator" id="liveIndicator"></div>
      <div class="clock" id="clock">—</div>
      <div class="status-pill" id="overallPill"><span class="dot"></span><span id="overallText">checking…</span></div>
    </div>
  </header>

  <div class="pulse-panel">
    <div class="pulse-label">system pulse</div>
    <div class="pulse-track" id="pulseTrack"></div>
  </div>

  <div class="section-title">Regions</div>
  <div class="cards" id="cards"></div>

  <div class="map-panel">
    <div class="section-title" style="margin-bottom:14px;">Node map</div>
    <div class="map-holder">
      <svg id="worldMap" viewBox="0 0 960 460" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>

  <div class="section-title">Endpoint health</div>
  <div class="health-cards" id="healthCardsGlobal"></div>

  <div class="section-title" style="margin-top:2px;">Per-region checks</div>
  <div class="region-health" id="regionHealth"></div>

  <div class="panel">
    <div class="panel-head">
      <div class="section-title" style="margin:0;" id="chartTitle">Latency — last 24h</div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="chart-holder"><canvas id="latencyChart"></canvas></div>
  </div>

  <div class="section-title">Event log</div>
  <div class="log-panel" id="logPanel"></div>

</div>

<script>
(async function(){
  // ---------- Load live telemetry, if the collector has written any yet ----------
  // (see /scripts/check_pulse.py + /.github/workflows/pulse-check.yml)
  let LIVE = null;
  try {
    const res = await fetch('data/pulse-status.json', { cache: 'no-store' });
    if (res.ok) LIVE = await res.json();
  } catch (err) {
    // no network / file missing / opened via file:// — fall through to demo data below
  }
  const isLive = !!(LIVE && LIVE.generated_at);
  const liveRegions = (isLive && LIVE.regions) ? LIVE.regions : {};

  // ---------- Region metadata ----------
  // tag/name/color/x/y are fixed display metadata. base/status/uptime are demo
  // fallback numbers, overwritten below by liveRegions[code] whenever real
  // collector data is available.
  const REGIONS = [
    { code: 'us-east-1',      tag: 'IAD', name: 'US East (N. Virginia)',      base: 11,  status: 'good', uptime: 99.99, color: '#4fd1c5', x: 273.6, y: 130.3 },
    { code: 'us-east-2',      tag: 'CMH', name: 'US East (Ohio)',             base: 16,  status: 'good', uptime: 99.98, color: '#5eead4', x: 258.9, y: 126.8 },
    { code: 'us-west-2',      tag: 'PDX', name: 'US West (Oregon)',           base: 34,  status: 'good', uptime: 99.96, color: '#67e8f9', x: 152.8, y: 113.7 },
    { code: 'us-west-1',      tag: 'SJC', name: 'US West (N. California)',    base: 38,  status: 'good', uptime: 99.94, color: '#38bdf8', x: 154.9, y: 134.4 },
    { code: 'eu-west-1',      tag: 'DUB', name: 'Europe (Ireland)',           base: 24,  status: 'good', uptime: 99.97, color: '#a7f3d0', x: 463.3, y: 93.7 },
    { code: 'eu-central-1',   tag: 'FRA', name: 'Europe (Frankfurt)',         base: 18,  status: 'good', uptime: 99.97, color: '#7dd3fc', x: 503.2, y: 102.0 },
    { code: 'me-south-1',     tag: 'BAH', name: 'Middle East (Bahrain)',      base: 165, status: 'warn', uptime: 99.42, color: '#fbbf24', x: 614.7, y: 163.6 },
    { code: 'ap-southeast-1', tag: 'SIN', name: 'Asia Pacific (Singapore)',   base: 178, status: 'good', uptime: 99.93, color: '#fda4af', x: 756.8, y: 226.6 },
    { code: 'ap-southeast-2', tag: 'SYD', name: 'Asia Pacific (Sydney)',      base: 41,  status: 'good', uptime: 99.95, color: '#c4b5fd', x: 883.2, y: 316.6 },
    { code: 'sa-east-1',      tag: 'GRU', name: 'South America (São Paulo)', base: null,status: 'down', uptime: 97.11, color: '#f87171', x: 355.7, y: 290.1 },
  ];

  REGIONS.forEach(r => {
    const lr = liveRegions[r.code];
    if (lr) {
      r.status = lr.status;
      r.base = (lr.ttfb_ms !== undefined) ? lr.ttfb_ms : null;
      r.uptime = (lr.uptime_tracked_pct !== undefined) ? lr.uptime_tracked_pct : null;
    }
  });

  const STATUS_LABEL = { good: 'operational', warn: 'degraded', down: 'unreachable' };

  // ---------- Live/demo indicator ----------

          const point = hist[i];
          return point ? point.ttfb : null;
        })
      : series(r.base, r.status === 'warn' ? 18 : undefined);
    return {
      label: r.tag,
      data,
      borderColor: r.color,
      backgroundColor: r.color,
      borderWidth: 1.75,
      pointRadius: 0,
      tension: 0.35,
      spanGaps: true,
    };
  });

  // legend
  const legendEl = document.getElementById('legend');
  REGIONS.forEach(r => {
    legendEl.innerHTML += `<span><i style="background:${r.color}"></i>${r.tag}</span>`;
  });

  new Chart(document.getElementById('latencyChart'), {
    type: 'line',
    data: { labels: chartLabels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: {
        backgroundColor: '#171b21', borderColor: '#21262e', borderWidth: 1,
        titleFont: { family: 'IBM Plex Mono', size: 11 },
        bodyFont: { family: 'IBM Plex Mono', size: 11 },
        padding: 10,
      }},
      scales: {
        x: { grid: { color: '#171b21' }, ticks: { color: '#4b525a', font: { family:'IBM Plex Mono', size: 10 }, maxTicksLimit: 8 } },
        y: { grid: { color: '#171b21' }, ticks: { color: '#4b525a', font: { family:'IBM Plex Mono', size: 10 } }, title: { display:true, text:'ms', color:'#4b525a', font:{ family:'IBM Plex Mono', size:10 } } }
      }
    }
  });

  // ---------- Event log ----------
  const EVENTS_DEMO = [
    { t: '14:58:02', region: 'gru', kind: 'down', text: 'unreachable — 5/5 probes failed' },
    { t: '14:41:17', region: 'sin', kind: 'warn', text: 'latency degraded → p95 above 180ms' },
    { t: '13:05:44', region: 'fra', kind: 'good', text: 'recovered → 18ms' },
    { t: '13:02:10', region: 'fra', kind: 'warn', text: 'latency degraded → p95 above 90ms' },
    { t: '11:47:33', region: 'iad', kind: 'good', text: 'probe ok — 11ms' },
    { t: '09:12:05', region: 'syd', kind: 'good', text: 'recovered → 39ms' },
    { t: '09:09:58', region: 'syd', kind: 'warn', text: 'timeout on 2/5 probes' },
  ];
  const codeToTag = Object.fromEntries(REGIONS.map(r => [r.code, r.tag.toLowerCase()]));
  const EVENTS = (isLive && LIVE.events && LIVE.events.length)
    ? LIVE.events.map(e => ({ t: e.t, region: codeToTag[e.region] || e.region, kind: e.kind, text: e.text }))
    : EVENTS_DEMO;

  const logEl = document.getElementById('logPanel');
  if (isLive && EVENTS.length === 0) {
    const div = document.createElement('div');
    div.className = 'log-line';
    div.textContent = 'no status changes recorded yet — the log fills in as the collector keeps running.';
    logEl.appendChild(div);
  } else {
    EVENTS.forEach(e => {
      const cls = e.kind === 'down' ? 'r-down' : e.kind === 'warn' ? 'r-warn' : 'r-good';
      const div = document.createElement('div');
      div.className = 'log-line';
      div.innerHTML = `<span class="t">[${e.t}]</span> <span class="${cls}">${e.region}</span> · ${e.text}`;
      logEl.appendChild(div);
    });
  }
  const cursorLine = document.createElement('div');
  cursorLine.className = 'log-line';
  cursorLine.innerHTML = `<span class="t">[${isLive ? 'live' : 'demo'}]</span> waiting for next probe cycle<span class="cursor"></span>`;
  logEl.appendChild(cursorLine);
})();
</script>


<script>
(function(){
  var CURRENT_PAGE = "tel";
  var TARGET_URLS = { report: "index.html", tel: "pulse.html" };

  var log = document.getElementById('navLog');
  var input = document.getElementById('navCmdInput');
  var chipReport = document.getElementById('navChipReport');
  var chipTel = document.getElementById('navChipTel');
  var busy = false;

  function markActiveChip(){
    chipReport.classList.toggle('active', CURRENT_PAGE === 'report');
    chipTel.classList.toggle('active', CURRENT_PAGE === 'tel');
  }
  markActiveChip();

  function addLine(text, cls){
    var row = document.createElement('div');
    row.className = 'term-line ' + (cls || '');
    row.innerHTML = '<span class="prompt-sym">' + (cls === 'out' ? '' : '$') + '</span><span>' + text + '</span>';
    log.appendChild(row);
    return row;
  }
  function clearLog(){ log.innerHTML = ''; }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  async function runCommand(target){
    if (busy) return;
    if (target !== 'report' && target !== 'tel') {
      clearLog();
      addLine('command not found: ' + target, 'out');
      input.value = '';
      await wait(1100);
      clearLog();
      return;
    }
    if (target === CURRENT_PAGE) { input.value = ''; return; }

    busy = true;
    input.disabled = true;
    clearLog();
    var cmdName = target === 'tel' ? './tel' : './report';
    addLine(cmdName);
    input.value = '';
    await wait(280);
    addLine(target === 'tel' ? 'resolving zeinan.fyi/tel &hellip;' : 'resolving zeinan.fyi &hellip;', 'out');
    await wait(380);
    addLine('connected.', 'out');
    await wait(260);
    document.body.classList.add('nav-flicker');
    await wait(300);
    window.location.href = TARGET_URLS[target];
  }

  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter') {
      var raw = input.value.trim().toLowerCase();
      var target = null;
      if (raw.indexOf('tel') !== -1 || raw.indexOf('telemetry') !== -1 || raw.indexOf('network') !== -1 || raw.indexOf('monitor') !== -1) target = 'tel';
      else if (raw.indexOf('report') !== -1 || raw.indexOf('browser') !== -1 || raw.indexOf('home') !== -1) target = 'report';
      else target = raw.replace('./', '');
      runCommand(target);
    }
  });
  chipReport.addEventListener('click', function(){ runCommand('report'); });
  chipTel.addEventListener('click', function(){ runCommand('tel'); });

  async function setGuestHandle(){
    var promptUser = document.getElementById('promptUser');
    try {
      var res = await fetch('https://api.ipify.org?format=json');
      var data = await res.json();
      var ip = data.ip || '';
      var digitsOnly = ip.replace(/[^0-9]/g, '');
      var digits = digitsOnly.slice(-4) || String(Math.floor(1000 + Math.random() * 9000));
      promptUser.textContent = 'guest-' + digits;
    } catch (err) {
      var fallback = Math.floor(1000 + Math.random() * 9000);
      promptUser.textContent = 'guest-' + fallback;
    }
  }
  setGuestHandle();
})();
</script>
</body>
